<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Milan Party Registration</title>
    <link rel="icon" type="image/png" href="FVIcon.png">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .lang-switcher { margin-bottom: 20px; }
        .lang-btn {
            background: #fff;
            border: 2px solid #0a3d7a;
            color: #0a3d7a;
            padding: 5px 25px;
            cursor: pointer;
            border-radius: 20px;
            font-weight: bold;
            margin: 0 5px;
        }
        .lang-btn.active {
            background: #0a3d7a;
            color: white;
        }

        .registration-card {
            background: #ffffff;
            max-width: 550px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        /* FIX: Using the exact Case-Sensitive filename from your GitHub */
        .header-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .intro-section {
            padding: 20px 30px;
            text-align: center;
        }

        .intro-msg {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
        }

        .form-section { padding: 0 40px 40px 40px; }
        
        label { 
            display: block; 
            margin-top: 20px; 
            font-weight: 500; 
            color: #333; 
            font-size: 15px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fafafa;
        }

        .guest-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
        }

        .register-btn {
            background-color: #0a3d7a;
            color: white;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('en')" id="en-btn">English</button>
        <button class="lang-btn" onclick="setLanguage('de')" id="de-btn">Deutsch</button>
    </div>

    <div class="registration-card">
        <img src="Header_BG.jpg" alt="Eid Milan Party" class="header-image">

        <div class="intro-section">
            <p class="intro-msg" id="intro-message">
                Join us for a joyful Eid Milan gathering as we celebrate the blessings of Eid ul Adha. Let’s come together to share the happiness of this special occasion with food, friendship, and community spirit.
            </p>
        </div>

        <div class="form-section">
            <form action="https://formspree.io/f/YOUR_ID_HERE" method="POST">
                <label for="name" id="label-name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="phone" id="label-phone">Phone Number (WhatsApp)</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="city" id="label-city">City</label>
                <input type="text" id="city" name="city" required>

                <div class="guest-grid">
                    <div>
                        <label for="adults" id="label-adults">Adults</label>
                        <input type="number" id="adults" name="adults" value="1" min="1">
                    </div>
                    <div>
                        <label for="kids" id="label-kids">Kids</label>
                        <input type="number" id="kids" name="kids" value="0" min="0">
                    </div>
                </div>

                <label for="notes" id="label-notes">Special Requests (Optional)</label>
                <textarea id="notes" name="notes" rows="3"></textarea>

                <button type="submit" class="register-btn" id="submit-btn">Submit Registration</button>
            </form>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                intro: "Join us for a joyful Eid Milan gathering as we celebrate the blessings of Eid ul Adha. Let’s come together to share the happiness of this special occasion with food, friendship, and community spirit.",
                labelName: "Full Name", labelPhone: "Phone Number (WhatsApp)", labelCity: "City",
                labelAdults: "Adults", labelKids: "Kids", labelNotes: "Special Requests (Optional)",
                submitBtn: "Submit Registration"
            },
            de: {
                intro: "Feiern Sie mit uns ein freudiges Eid Milan Treffen zum gesegneten Eid ul Adha Fest. Lassen Sie uns zusammenkommen, um das Glück dieses besonderen Anlasses bei gutem Essen und in herzlicher Gemeinschaft zu teilen.",
                labelName: "Vollständiger Name", labelPhone: "Telefonnummer (WhatsApp)", labelCity: "Stadt",
                labelAdults: "Erwachsene", labelKids: "Kinder", labelNotes: "Besondere Wünsche (Optional)",
                submitBtn: "Registrierung Absenden"
            }
        };

        function setLanguage(lang) {
            document.getElementById('intro-message').innerText = translations[lang].intro;
            document.getElementById('label-name').innerText = translations[lang].labelName;
            document.getElementById('label-phone').innerText = translations[lang].labelPhone;
            document.getElementById('label-city').innerText = translations[lang].labelCity;
            document.getElementById('label-adults').innerText = translations[lang].labelAdults;
            document.getElementById('label-kids').innerText = translations[lang].labelKids;
            document.getElementById('label-notes').innerText = translations[lang].labelNotes;
            document.getElementById('submit-btn').innerText = translations[lang].submitBtn;
            document.getElementById('en-btn').classList.toggle('active', lang === 'en');
            document.getElementById('de-btn').classList.toggle('active', lang === 'de');
        }
    </script>
</body>
</html>
