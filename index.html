<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Milan Party Registration</title>

    <link rel="icon" type="image/png" href="FVIcon.png?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .lang-switcher { margin-bottom: 20px; }

        .lang-btn {
            background: #fff;
            border: 2px solid #0a3d7a;
            color: #0a3d7a;
            padding: 5px 15px;
            cursor: pointer;
            border-radius: 20px;
            font-weight: bold;
            margin: 0 5px;
            transition: 0.3s;
        }

        .lang-btn.active {
            background: #0a3d7a;
            color: white;
        }

        .registration-card {
            background: #ffffff;
            max-width: 500px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            text-align: center;
        }

        .header-banner {
            width: 100%;
            height: auto;
            display: block;
        }

        form { 
            text-align: left; 
            padding: 0 30px 30px 30px; 
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .guest-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .register-btn {
            background-color: #0a3d7a;
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
        }

        .register-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('en')" id="en-btn">English</button>
        <button class="lang-btn" onclick="setLanguage('de')" id="de-btn">Deutsch</button>
    </div>

    <div class="registration-card">
        <img src="header_bg.png" alt="Eid Milan Party Header" class="header-banner">

        <div style="padding: 20px 25px; margin: 20px 30px 0 30px; background-color: #eef6ff; border-radius: 12px; text-align: center; border: 1px solid #d0e3ff; box-shadow: inset 0 0 10px rgba(10, 61, 122, 0.05);">
            <p id="intro-text" style="color: #0a3d7a; font-family: 'Libre Baskerville', serif; font-size: 18px; line-height: 1.6; margin: 0; font-weight: 400; font-style: italic;">
                Join us for a joyful Eid Milan gathering! Let’s celebrate the blessings of Eid ul Adha together with food, friendship, and community spirit. We look forward to seeing you and your family.
            </p>
        </div>

        <h3 id="reg-heading" style="color: #0a3d7a; margin: 25px 0 10px 0; font-size: 22px; text-transform: uppercase; letter-spacing: 1px;">
            Registration Form
        </h3>
        
        <form id="registration-form">
            <label for="name" id="label-name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Lead Guest Name" required>

            <label for="phone" id="label-phone">Phone Number (WhatsApp)</label>
            <input type="tel" id="phone" name="phone" placeholder="e.g. 0176 30375907" required>

            <label for="city" id="label-city">City</label>
            <input type="text" id="city" name="city" placeholder="From which city?" required>

            <div class="guest-grid">
                <div>
                    <label for="adults" id="label-adults">Adults</label>
                    <input type="number" id="adults" name="adults" value="1" min="1">
                </div>
                <div>
                    <label for="kids" id="label-kids">Kids</label>
                    <input type="number" id="kids" name="kids" value="0" min="0">
                </div>
            </div>

            <label for="notes" id="label-notes">Special Requests</label>
            <textarea id="notes" name="notes" rows="2" placeholder="Dietary needs..."></textarea>

            <button type="submit" class="register-btn" id="submit-btn">Submit Registration</button>
        </form>
    </div>

    <script>
        // --- GOOGLE SHEETS INTEGRATION ---
        const deploymentID = 'AKfycbyc-EN0U2KjvVJbIZugDDcaxXrTl0TRWjmX2_azW0t_GVrAzx3JNdKmaE5nxztUCUP9Ig'; 
        const scriptURL = `https://script.google.com/macros/s/AKfycbyc-EN0U2KjvVJbIZugDDcaxXrTl0TRWjmX2_azW0t_GVrAzx3JNdKmaE5nxztUCUP9Ig/exec`;
        const form = document.getElementById('registration-form');
        const btn = document.getElementById('submit-btn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btn.disabled = true;
            const originalBtnText = btn.innerText;
            btn.innerText = "Sending...";

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    alert("Registration successful!");
                    form.reset();
                    btn.disabled = false;
                    btn.innerText = originalBtnText;
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert("Something went wrong. Please try again.");
                    btn.disabled = false;
                    btn.innerText = originalBtnText;
                });
        });

        // --- TRANSLATION LOGIC ---
        const translations = {
            en: {
                intro: "Join us for a joyful Eid Milan gathering! Let’s celebrate the blessings of Eid ul Adha together with food, friendship, and community spirit. We look forward to seeing you and your family.",
                regHeading: "Registration Form",
                labelName: "Full Name",
                labelPhone: "Phone Number (WhatsApp)",
                labelCity: "City",
                labelAdults: "Adults",
                labelKids: "Kids",
                labelNotes: "Special Requests",
                submitBtn: "Submit Registration",
                placeholders: {
                    name: "Lead Guest Name",
                    city: "From which city?",
                    notes: "Dietary needs..."
                }
            },
            de: {
                intro: "Herzliche Einladung zu unserem Eid Milan Treffen! Lassen Sie uns die Segnungen von Eid ul Adha gemeinsam mit gutem Essen und Gemeinschaft feiern. Wir freuen uns auf Sie und Ihre Familie.",
                regHeading: "Anmeldeformular",
                labelName: "Vollständiger Name",
                labelPhone: "Telefonnummer (WhatsApp)",
                labelCity: "Stadt",
                labelAdults: "Erwachsene",
                labelKids: "Kinder",
                labelNotes: "Besondere Wünsche",
                submitBtn: "Registrierung Absenden",
                placeholders: {
                    name: "Name des Hauptgastes",
                    city: "Aus welcher Stadt kommen Sie?",
                    notes: "Ernährungswünsche..."
                }
            }
        };

        function setLanguage(lang) {
            document.getElementById('intro-text').innerText = translations[lang].intro;
            document.getElementById('reg-heading').innerText = translations[lang].regHeading;
            document.getElementById('label-name').innerText = translations[lang].labelName;
            document.getElementById('label-phone').innerText = translations[lang].labelPhone;
            document.getElementById('label-city').innerText = translations[lang].labelCity;
            document.getElementById('label-adults').innerText = translations[lang].labelAdults;
            document.getElementById('label-kids').innerText = translations[lang].labelKids;
            document.getElementById('label-notes').innerText = translations[lang].labelNotes;
            document.getElementById('submit-btn').innerText = translations[lang].submitBtn;

            document.getElementById('name').placeholder = translations[lang].placeholders.name;
            document.getElementById('city').placeholder = translations[lang].placeholders.city;
            document.getElementById('notes').placeholder = translations[lang].placeholders.notes;

            document.getElementById('en-btn').classList.toggle('active', lang === 'en');
            document.getElementById('de-btn').classList.toggle('active', lang === 'de');
        }
    </script>
</body>
</html>
